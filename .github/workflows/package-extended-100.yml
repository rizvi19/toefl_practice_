name: Validate and package section tests
on:
  push:
    branches: [main]
    paths: ['index.html', 'library.html', 'exam/**', 'reading/**', 'listening/**', 'writing.html', 'sentence-practice.html', 'writing/**', 'tests/**', 'assets/**', 'audio/**', 'docs/**', 'collections/**', 'tools/**', 'package*.json', '.github/workflows/**']
  pull_request:
    paths: ['index.html', 'library.html', 'exam/**', 'reading/**', 'listening/**', 'writing.html', 'sentence-practice.html', 'writing/**', 'tests/**', 'assets/**', 'audio/**', 'docs/**', 'collections/**', 'tools/**', 'package*.json', '.github/workflows/**']
  workflow_dispatch:
concurrency:
  group: practice-quality-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Rebuild and audit both banks; fingerprint preserved Reading
        run: |
          npm run build:bank
          python tools/package-kokoro-helper.py --check
          python tests/listening-audio-source.py
          npm run audit:reading
          npm run audit:listening
          git diff --exit-code -- reading/bank.json reading/library-bank.js listening/bank.json listening/library-bank.js exam/bank.json docs/READING_QUALITY_AUDIT.json docs/LISTENING_QUALITY_AUDIT.json
          npm run validate
          node tools/validate-listening.mjs
          npm run test:sections
          npm run audit:writing
          git diff --exit-code -- docs/WRITING_ADVANCED_AUDIT.json
          npm run test:writing
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Verify GitHub Pages subpath and preserved library/audio
        run: |
          set -euo pipefail
          node tools/serve-subpath.mjs > /tmp/toefl-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 2
          npm run test:browser
          npm run test:writing:browser
          npm run smoke
          node tools/smoke-listening-playwright.mjs
          node tools/smoke-timers-playwright.mjs
      - name: Package and verify extracted runtime
        run: |
          set -euo pipefail
          python tools/package-release.py /tmp/toefl-quality-release
          SITE_ROOT=/tmp/toefl-quality-release/extracted-pages node tools/validate-collection.mjs
          SITE_ROOT=/tmp/toefl-quality-release/extracted-pages node tools/validate-listening.mjs
          SITE_ROOT=/tmp/toefl-quality-release/extracted-pages node tools/serve-subpath.mjs > /tmp/toefl-extracted.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 2
          npm run test:browser
          npm run test:writing:browser
          npm run smoke
          node tools/smoke-listening-playwright.mjs
          node tools/smoke-timers-playwright.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: TOEFL-Reading222-Items1400-Listening200-Questions450-Verified
          path: |
            /tmp/toefl-quality-release/*.zip
            /tmp/toefl-quality-release/SHA256SUMS.txt
          retention-days: 90
